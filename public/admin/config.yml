# Sveltia CMS Configuration for Homegear
backend:
  name: github
  repo: taimoorsattar7/homegear
  branch: master

# Enable local backend proxy for offline & local development (run `npm run cms`)
local_backend: true

media_folder: "src/images"
public_folder: "@/images"

collections:
  - name: "projects"
    label: "Projects We Have Worked On"
    label_singular: "Project"
    icon: "work"
    folder: "src/app/work"
    path: "{{slug}}/page"
    extension: "mdx"
    format: "frontmatter"
    nested:
      depth: 2
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client / Project Name", name: "client", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date (YYYY-MM)", name: "date", widget: "string" }
      - { label: "Service / Category", name: "service", widget: "string" }
      - { label: "Short Description", name: "description", widget: "text" }
      - label: "Project Snapshots / Screenshots"
        name: "snapshots"
        widget: "list"
        required: false
        field: { label: "Snapshot Image", name: "image", widget: "image" }
      - label: "Summary Paragraphs"
        name: "summary"
        widget: "list"
        field: { label: "Paragraph", name: "paragraph", widget: "text" }
      - label: "Testimonial (Optional)"
        name: "testimonial"
        widget: "object"
        required: false
        fields:
          - label: "Author"
            name: "author"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
          - { label: "Content", name: "content", widget: "text" }
      - { label: "Project Content (MDX)", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog Articles"
    label_singular: "Article"
    icon: "article"
    folder: "src/app/blog"
    path: "{{slug}}/page"
    extension: "mdx"
    format: "frontmatter"
    nested:
      depth: 2
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Author"
        name: "author"
        widget: "select"
        options:
          - "Taimoor Sattar"
          - "Angela Fisher"
          - "Leslie Alexander"
          - "Dries Vincent"
          - "Kathryn Murphy"
          - "Chelsea Hagon"
          - "Emma Dorsey"
      - { label: "Article Content (MDX)", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Website Pages Content"
    icon: "folder"
    format: "json"
    files:
      - label: "Home Page"
        name: "home_page"
        icon: "home"
        file: "src/content/home.json"
        format: "json"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroDescription", widget: "text" }
          - { label: "Clients Section Heading", name: "clientsHeading", widget: "string" }
          - { label: "Services Eyebrow", name: "servicesEyebrow", widget: "string" }
          - { label: "Services Section Title", name: "servicesTitle", widget: "string" }
          - { label: "Services Section Description", name: "servicesDescription", widget: "text" }
          - label: "Services List"
            name: "servicesList"
            widget: "list"
            fields:
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "Service Description", name: "description", widget: "text" }

      - label: "Our Work Page"
        name: "work_page"
        icon: "work"
        file: "src/content/work.json"
        format: "json"
        fields:
          - { label: "Page Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Intro Description", name: "intro", widget: "text" }
          - { label: "Clients Heading", name: "clientsHeading", widget: "string" }

      - label: "About Us Page"
        name: "about_page"
        icon: "info"
        file: "src/content/about.json"
        format: "json"
        fields:
          - { label: "Page Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Main Intro Paragraph", name: "introMain", widget: "text" }
          - { label: "Secondary Intro Paragraph", name: "introSecondary", widget: "text" }
          - { label: "Culture Section Eyebrow", name: "cultureEyebrow", widget: "string" }
          - { label: "Culture Section Title", name: "cultureTitle", widget: "string" }
          - { label: "Culture Section Description", name: "cultureDescription", widget: "text" }
          - label: "Culture Values List"
            name: "cultureList"
            widget: "list"
            fields:
              - { label: "Value Title", name: "title", widget: "string" }
              - { label: "Value Description", name: "description", widget: "text" }

      - label: "Our Process Page"
        name: "process_page"
        icon: "settings"
        file: "src/content/process.json"
        format: "json"
        fields:
          - { label: "Page Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Intro Description", name: "intro", widget: "text" }
          - { label: "Discover Title", name: "discoverTitle", widget: "string" }
          - { label: "Discover Description", name: "discoverContent", widget: "text" }
          - { label: "Build Title", name: "buildTitle", widget: "string" }
          - { label: "Build Description", name: "buildContent", widget: "text" }
          - { label: "Deliver Title", name: "deliverTitle", widget: "string" }
          - { label: "Deliver Description", name: "deliverContent", widget: "text" }
          - { label: "Values Eyebrow", name: "valuesEyebrow", widget: "string" }
          - { label: "Values Title", name: "valuesTitle", widget: "string" }
          - { label: "Values Description", name: "valuesIntro", widget: "text" }
          - label: "Process Values List"
            name: "valuesList"
            widget: "list"
            fields:
              - { label: "Value Title", name: "title", widget: "string" }
              - { label: "Value Description", name: "description", widget: "text" }

      - label: "Blog Page Header"
        name: "blog_page"
        icon: "article"
        file: "src/content/blog.json"
        format: "json"
        fields:
          - { label: "Page Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Intro Description", name: "intro", widget: "text" }

      - label: "Team Members"
        name: "team_members"
        icon: "people"
        file: "src/content/team.json"
        format: "json"
        fields:
          - label: "Team Member List"
            name: "team"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Image Path", name: "image", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }

      - label: "Company Info & Contact"
        name: "company_info"
        icon: "mail"
        file: "src/content/company.json"
        format: "json"
        fields:
          - { label: "Company Name", name: "name", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Contact Phone", name: "phone", widget: "string" }
